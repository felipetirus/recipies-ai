<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Recipes - Recipe Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --surface-0: #f5f5f5;
            --surface-1: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-accent: #3b82f6;
            --border: #e5e5e5;
            --border-strong: #d0d0d0;
            --bg-accent: #3b82f6;
            --radius: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --surface-0: #1a1a1a;
                --surface-1: #2d2d2d;
                --text-primary: #ffffff;
                --text-secondary: #b0b0b0;
                --border: #404040;
                --border-strong: #505050;
                --bg-accent: #3b82f6;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--surface-0);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .filters {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            background-color: var(--surface-1);
            color: var(--text-primary);
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .meal-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: var(--surface-1);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s;
            text-transform: capitalize;
        }

        button:hover {
            border-color: var(--border-strong);
        }

        button.active {
            background-color: var(--bg-accent);
            color: white;
            border-color: var(--bg-accent);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .recipe-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--surface-1);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .recipe-card:hover {
            border-color: var(--border-strong);
        }

        .recipe-card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: var(--border);
        }

        .recipe-card-content {
            padding: 16px;
        }

        .recipe-meal-type {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: capitalize;
        }

        .recipe-card h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .recipe-card p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin: 0 0 12px 0;
        }

        .recipe-card-nutrition {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--surface-1);
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background-color: var(--surface-1);
            z-index: 10;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 24px;
            background-color: var(--border);
        }

        .section {
            margin-bottom: 24px;
        }

        .section h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .section ul,
        .section ol {
            margin-left: 20px;
            color: var(--text-secondary);
        }

        .section li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .nutrition-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            overflow-x: auto;
        }

        .nutrition-table th {
            text-align: left;
            padding: 8px 0;
            font-weight: 500;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
        }

        .nutrition-table td {
            padding: 8px 0;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .nutrition-table td:last-child {
            text-align: right;
        }

        .ingredients-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            overflow-x: auto;
        }

        .ingredients-table th {
            text-align: left;
            padding: 8px;
            font-weight: 500;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border);
            background-color: var(--surface-0);
        }

        .ingredients-table td {
            padding: 8px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .ingredients-table td:last-child,
        .ingredients-table th:last-child {
            text-align: right;
        }

        .radar-chart {
            width: 100%;
            height: 300px;
            margin: 0 auto;
        }

        .footer {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .no-results {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }

        .no-results p {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .no-results p:last-child {
            font-size: 14px;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .nav-brand {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .nav-links {
            display: flex;
            gap: 16px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--text-accent);
        }

        .nav-link.active {
            color: var(--text-accent);
        }
    </style>
</head>

        let selectedMealType = 'all';

        function filterRecipes() {
            const grid = document.getElementById('recipeGrid');
            const noResults = document.getElementById('noResults');

                const matchesMealType = selectedMealType === 'all' || recipe.mealType === selectedMealType;

                const matchesSearch = 
                    recipe.name.toLowerCase().includes(searchLower) ||
                    recipe.ingredients.some(ing => ing.name.toLowerCase().includes(searchLower));
                return matchesMealType && matchesSearch;
            });

            grid.innerHTML = '';

            if (filtered.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                recipeCount.textContent = `Showing 0 of ${recipes.length} recipes`;
            } else {
                grid.style.display = 'grid';
                noResults.style.display = 'none';
                filtered.forEach(recipe => {
                    const card = createRecipeCard(recipe);
                    grid.appendChild(card);
                });
                recipeCount.textContent = `Showing ${filtered.length} of ${recipes.length} recipes`;
            }
        }

        function createRecipeCard(recipe) {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            
            // Calculate per-serving values based on quantityPerServing (100g)
            const servingRatio = recipe.quantityPerServing / recipe.baseWeight;
            const caloriesPerServing = (recipe.nutrition.calories * servingRatio).toFixed(0);
            const proteinPerServing = (recipe.nutrition.protein * servingRatio).toFixed(1);
            
            card.innerHTML = `
                <img src="${recipe.imageUrl}" alt="${recipe.name}" class="recipe-card-image" onerror="this.style.backgroundColor='var(--border)'">
                <div class="recipe-card-content">
                    <div class="recipe-meal-type">${recipe.mealType}</div>
                    <h3>${recipe.name}</h3>
                    <p>${recipe.description}</p>
                    <div class="recipe-card-nutrition">
                        <div>${recipe.quantityPerServing}g per serving</div>
                        <div>${caloriesPerServing} kcal</div>
                        <div>${proteinPerServing}g protein</div>
                    </div>
                </div>
            `;
            card.onclick = () => openModal(recipe);
            return card;
        }

        function openModal(recipe) {
            const modal = document.getElementById('recipeModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            const servingRatio = recipe.quantityPerServing / recipe.baseWeight;

            title.textContent = recipe.name;
            body.innerHTML = `
                <img src="${recipe.imageUrl}" alt="${recipe.name}" class="modal-image" onerror="this.style.backgroundColor='var(--border)'">
                
                <div class="section">
                    <h3>Ingredients</h3>
                    <table class="ingredients-table">
                        <thead>
                            <tr>
                                <th>Quantity & Ingredient</th>
                                <th>Calories</th>
                                <th>Protein</th>
                                <th>Carbohydrates</th>
                                <th>Fat</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${recipe.ingredients.map(ing => `
                                <tr>
                                    <td>${ing.quantity}${ing.unit} ${ing.name}</td>
                                    <td>${ing.calories.toFixed(0)}</td>
                                    <td>${ing.protein.toFixed(1)}g</td>
                                    <td>${ing.carbohydrates.toFixed(1)}g</td>
                                    <td>${ing.fat.toFixed(1)}g</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <h3>Steps to cook</h3>
                    <ol>
                        ${recipe.steps.map(step => `<li>${step}</li>`).join('')}
                    </ol>
                </div>

                <div class="section">
                    <h3>Nutrition facts</h3>
                    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">Per serving (${recipe.quantityPerServing}g)</p>
                    <table class="nutrition-table">
                        <tr>
                            <th>Nutrient</th>
                            <th>Amount</th>
                        </tr>
                        <tr>
                            <td>Calories</td>
                            <td>${(recipe.nutrition.calories * servingRatio).toFixed(0)} kcal</td>
                        </tr>
                        <tr>
                            <td>Protein</td>
                            <td>${(recipe.nutrition.protein * servingRatio).toFixed(1)}g</td>
                        </tr>
                        <tr>
                            <td>Carbohydrates</td>
                            <td>${(recipe.nutrition.carbohydrates * servingRatio).toFixed(1)}g</td>
                        </tr>
                        <tr>
                            <td>Fat</td>
                            <td>${(recipe.nutrition.fat * servingRatio).toFixed(1)}g</td>
                        </tr>
                        <tr>
                            <td>Saturated fat</td>
                            <td>${(recipe.nutrition.saturatedFat * servingRatio).toFixed(1)}g</td>
                        </tr>
                        <tr>
                            <td>Fiber</td>
                            <td>${(recipe.nutrition.fiber * servingRatio).toFixed(1)}g</td>
                        </tr>
                        <tr>
                            <td>Sugar</td>
                            <td>${(recipe.nutrition.sugar * servingRatio).toFixed(1)}g</td>
                        </tr>
                    </table>
                </div>

                <div class="section">
                    <h3>Nutrition breakdown</h3>
                    <svg viewBox="0 0 300 300" class="radar-chart">
                        <circle cx="150" cy="150" r="30" fill="none" stroke="var(--border)" stroke-width="1"/>
                        <circle cx="150" cy="150" r="60" fill="none" stroke="var(--border)" stroke-width="1"/>
                        <circle cx="150" cy="150" r="90" fill="none" stroke="var(--border)" stroke-width="1"/>
                        
                        <line x1="150" y1="10" x2="150" y2="290" stroke="var(--border)" stroke-width="1"/>
                        <line x1="10" y1="150" x2="290" y2="150" stroke="var(--border)" stroke-width="1"/>
                        <line x1="60" y1="60" x2="240" y2="240" stroke="var(--border)" stroke-width="1"/>
                        <line x1="240" y1="60" x2="60" y2="240" stroke="var(--border)" stroke-width="1"/>
                        
                        <polygon points="150,50 200,100 175,175 125,175 100,100" fill="rgba(59, 130, 246, 0.3)" stroke="var(--text-accent)" stroke-width="2"/>
                        
                        <text x="150" y="25" text-anchor="middle" font-size="11" fill="var(--text-secondary)">Protein</text>
                        <text x="220" y="155" text-anchor="start" font-size="11" fill="var(--text-secondary)">Carbs</text>
                        <text x="150" y="280" text-anchor="middle" font-size="11" fill="var(--text-secondary)">Fat</text>
                        <text x="80" y="155" text-anchor="end" font-size="11" fill="var(--text-secondary)">Fiber</text>
                        <text x="130" y="85" text-anchor="middle" font-size="11" fill="var(--text-secondary)">Calories</text>
                    </svg>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('recipeModal');
            modal.classList.remove('active');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            filterRecipes();
        });

        document.querySelectorAll('.meal-filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.meal-filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMealType = btn.dataset.type;
                filterRecipes();
            });
        });

        // Initialize filters on page load
        filterRecipes();
    </script>
</body>
</html>
