<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Recipes - AI Powered Recipe Browser</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/recharts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            --surface-0: #f5f5f5;
            --surface-1: #ffffff;
            --surface-2: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
            --text-accent: #3b82f6;
            --text-danger: #ef4444;
            --border: #e5e5e5;
            --border-strong: #d0d0d0;
            --bg-accent: #3b82f6;
            --radius: 8px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        @media (prefers-color-scheme: dark) {
            html {
                --surface-0: #1a1a1a;
                --surface-1: #2d2d2d;
                --surface-2: #1a1a1a;
                --text-primary: #ffffff;
                --text-secondary: #b0b0b0;
                --text-muted: #808080;
                --text-accent: #60a5fa;
                --border: #404040;
                --border-strong: #505050;
                --bg-accent: #3b82f6;
            }
        }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--surface-0);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        #root {
            min-height: 100vh;
            background-color: var(--surface-0);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useMemo } = React;
        const { RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar, ResponsiveContainer, Tooltip } = Recharts;

        const RecipeWebsite = () => {
            const recipesData = {
                recipes: [
                    {
                        id: 1,
                        name: "Farofa de Ovo",
                        mealType: "breakfast",
                        description: "Traditional Brazilian egg farofa with cassava flour and olive oil",
                        imageUrl: "https://images.unsplash.com/photo-1585521537872-f90e99258e1e?w=400&h=300&fit=crop",
                        servings: 1,
                        ingredients: ["2 Whole Eggs", "35g Farinha de mandioca", "15g Extra Virgin Olive Oil"],
                        steps: ["Heat olive oil in a pan over medium heat", "Crack eggs and scramble until cooked through", "Add cassava flour gradually while stirring", "Mix until golden and crumbly texture forms", "Season to taste and serve hot"],
                        nutrition: { calories: 391, protein: 13.02, carbohydrates: 30.8, fat: 24, saturatedFat: 4.65, fiber: 0, sugar: 0 },
                        radarChartData: [
                            { category: "Calories", value: 39, fullValue: 391 },
                            { category: "Protein (g)", value: 13, fullValue: 13 },
                            { category: "Carbs (g)", value: 31, fullValue: 31 },
                            { category: "Fat (g)", value: 24, fullValue: 24 },
                            { category: "Fiber (g)", value: 2, fullValue: 2 }
                        ]
                    },
                    {
                        id: 2,
                        name: "Chickpea Curry",
                        mealType: "lunch",
                        description: "Creamy coconut chickpea curry with tomatoes and aromatic spices",
                        imageUrl: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400&h=300&fit=crop",
                        servings: 2,
                        ingredients: ["50g Onion", "20g Curry Powder Medium", "400g Chopped Tomato", "400g Chickpeas in Water", "400g Coconut Milk Light"],
                        steps: ["Dice onions and sauté in a large pot until soft", "Add curry powder and cook for 1-2 minutes until fragrant", "Add chopped tomatoes and simmer for 5 minutes", "Add drained chickpeas and coconut milk", "Simmer for 20 minutes until flavors combine", "Adjust seasoning and serve with rice"],
                        nutrition: { calories: 924, protein: 39.3, carbohydrates: 90.08, fat: 36.52, saturatedFat: 22.56, fiber: 15, sugar: 22.17 },
                        radarChartData: [
                            { category: "Calories", value: 92, fullValue: 924 },
                            { category: "Protein (g)", value: 39, fullValue: 39 },
                            { category: "Carbs (g)", value: 90, fullValue: 90 },
                            { category: "Fat (g)", value: 37, fullValue: 37 },
                            { category: "Fiber (g)", value: 15, fullValue: 15 }
                        ]
                    },
                    {
                        id: 3,
                        name: "Vitamina Bicudo",
                        mealType: "breakfast",
                        description: "Nutritious smoothie bowl with bananas, oats, and healthy fats",
                        imageUrl: "https://images.unsplash.com/photo-1590301157890-4810ed352733?w=400&h=300&fit=crop",
                        servings: 1,
                        ingredients: ["500g Almond roasted milk", "70g Oats Powder", "2 Bananas", "12g Flax Oil", "20g Honey", "2g Whey Protein"],
                        steps: ["Pour almond milk into a blender", "Add oats powder and blend until smooth", "Add sliced bananas and blend well", "Add flax oil and honey for sweetness", "Add whey protein powder and blend", "Pour into a bowl and serve immediately"],
                        nutrition: { calories: 700.94, protein: 14.82, carbohydrates: 95.87, fat: 25.75, saturatedFat: 3.68, fiber: 8, sugar: 55.38 },
                        radarChartData: [
                            { category: "Calories", value: 70, fullValue: 700 },
                            { category: "Protein (g)", value: 15, fullValue: 15 },
                            { category: "Carbs (g)", value: 96, fullValue: 96 },
                            { category: "Fat (g)", value: 26, fullValue: 26 },
                            { category: "Fiber (g)", value: 8, fullValue: 8 }
                        ]
                    },
                    {
                        id: 4,
                        name: "Falafel Wrap",
                        mealType: "lunch",
                        description: "Quick and delicious falafel wraps with hummus and vegetables",
                        imageUrl: "https://images.unsplash.com/photo-1585238341710-4b9c6c85eaeb?w=400&h=300&fit=crop",
                        servings: 1,
                        ingredients: ["2 Falafel", "2 Wraps", "35g Hummus", "80g Mixed Peppers", "50g Onion", "10g Extra Virgin Olive Oil"],
                        steps: ["Warm the wraps in a dry pan or microwave", "Spread hummus on each wrap", "Place falafel in the center of wrap", "Add sliced peppers and onions", "Drizzle with olive oil", "Wrap tightly and serve with extra hummus"],
                        nutrition: { calories: 564.08, protein: 14.42, carbohydrates: 72.39, fat: 21.96, saturatedFat: 3.31, fiber: 10, sugar: 10.16 },
                        radarChartData: [
                            { category: "Calories", value: 56, fullValue: 564 },
                            { category: "Protein (g)", value: 14, fullValue: 14 },
                            { category: "Carbs (g)", value: 72, fullValue: 72 },
                            { category: "Fat (g)", value: 22, fullValue: 22 },
                            { category: "Fiber (g)", value: 10, fullValue: 10 }
                        ]
                    },
                    {
                        id: 5,
                        name: "Broccoli Delight",
                        mealType: "dinner",
                        description: "Creamy broccoli curry with peppers and coconut milk",
                        imageUrl: "https://images.unsplash.com/photo-1609501676725-7186f017a4b1?w=400&h=300&fit=crop",
                        servings: 2,
                        ingredients: ["400g Broccoli", "300g Mixed Peppers", "7g Curry Powder", "400g Coconut Milk Light", "240g Red Kidney beans", "0.5 Lime"],
                        steps: ["Chop broccoli into florets and cut peppers into strips", "Heat coconut milk in a large pan", "Add curry powder and stir well", "Add broccoli and peppers, simmer 10 minutes", "Add kidney beans and warm through", "Squeeze fresh lime juice and serve hot"],
                        nutrition: { calories: 793.21, protein: 48.61, carbohydrates: 64.28, fat: 32.65, saturatedFat: 22.93, fiber: 18, sugar: 25.92 },
                        radarChartData: [
                            { category: "Calories", value: 79, fullValue: 793 },
                            { category: "Protein (g)", value: 49, fullValue: 49 },
                            { category: "Carbs (g)", value: 64, fullValue: 64 },
                            { category: "Fat (g)", value: 33, fullValue: 33 },
                            { category: "Fiber (g)", value: 18, fullValue: 18 }
                        ]
                    },
                    {
                        id: 6,
                        name: "Spanish Lentil Stew",
                        mealType: "lunch",
                        description: "Hearty Spanish-style lentil stew with vegetables and aromatic spices",
                        imageUrl: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400&h=300&fit=crop",
                        servings: 3,
                        ingredients: ["500g Red split lentils", "200g Onion", "200g Carrot", "15g Garlic", "450g Peas", "15g Tamari"],
                        steps: ["Dice onions, carrots, and garlic finely", "Sauté vegetables in a large pot until soft", "Rinse lentils and add to pot with 2 liters broth", "Bring to boil, then simmer 25 minutes until lentils are tender", "Add peas and simmer another 5 minutes", "Season with tamari and serve hot"],
                        nutrition: { calories: 1731.43, protein: 41.1, carbohydrates: 121.55, fat: 3, saturatedFat: 0.5, fiber: 25, sugar: 13.4 },
                        radarChartData: [
                            { category: "Calories", value: 173, fullValue: 1731 },
                            { category: "Protein (g)", value: 41, fullValue: 41 },
                            { category: "Carbs (g)", value: 122, fullValue: 122 },
                            { category: "Fat (g)", value: 3, fullValue: 3 },
                            { category: "Fiber (g)", value: 25, fullValue: 25 }
                        ]
                    }
                ]
            };

            const [searchTerm, setSearchTerm] = useState('');
            const [selectedMealType, setSelectedMealType] = useState('all');
            const [selectedRecipe, setSelectedRecipe] = useState(null);

            const filteredRecipes = useMemo(() => {
                return recipesData.recipes.filter(recipe => {
                    const matchesMealType = selectedMealType === 'all' || recipe.mealType === selectedMealType;
                    const searchLower = searchTerm.toLowerCase();
                    const matchesSearch = 
                        recipe.name.toLowerCase().includes(searchLower) ||
                        recipe.ingredients.some(ing => ing.toLowerCase().includes(searchLower));
                    return matchesMealType && matchesSearch;
                });
            }, [searchTerm, selectedMealType]);

            const RecipeCard = ({ recipe }) => (
                <div onClick={() => setSelectedRecipe(recipe)} style={{
                    cursor: 'pointer',
                    borderRadius: '12px',
                    overflow: 'hidden',
                    border: `1px solid var(--border)`,
                    transition: 'all 0.2s',
                    backgroundColor: 'var(--surface-1)'
                }} onMouseEnter={(e) => e.currentTarget.style.borderColor = 'var(--border-strong)'} onMouseLeave={(e) => e.currentTarget.style.borderColor = 'var(--border)'}>
                    <img src={recipe.imageUrl} alt={recipe.name} style={{ width: '100%', height: '180px', objectFit: 'cover' }} />
                    <div style={{ padding: '16px' }}>
                        <div style={{ fontSize: '14px', color: 'var(--text-secondary)', marginBottom: '4px', textTransform: 'capitalize' }}>
                            {recipe.mealType}
                        </div>
                        <h3 style={{ margin: '0 0 8px 0', fontSize: '16px', fontWeight: 500, color: 'var(--text-primary)' }}>
                            {recipe.name}
                        </h3>
                        <p style={{ margin: 0, fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.4 }}>
                            {recipe.description}
                        </p>
                        <div style={{ marginTop: '12px', fontSize: '12px', color: 'var(--text-secondary)' }}>
                            {recipe.nutrition.calories} kcal • {recipe.nutrition.protein.toFixed(0)}g protein
                        </div>
                    </div>
                </div>
            );

            const RecipeDetail = ({ recipe }) => (
                <div style={{ 
                    position: 'fixed', 
                    top: 0, 
                    left: 0, 
                    right: 0, 
                    bottom: 0, 
                    backgroundColor: 'rgba(0, 0, 0, 0.5)', 
                    display: 'flex', 
                    alignItems: 'center', 
                    justifyContent: 'center',
                    zIndex: 1000,
                    padding: '16px'
                }} onClick={() => setSelectedRecipe(null)}>
                    <div style={{
                        backgroundColor: 'var(--surface-2)',
                        borderRadius: '12px',
                        maxWidth: '800px',
                        width: '100%',
                        maxHeight: '90vh',
                        overflowY: 'auto'
                    }} onClick={(e) => e.stopPropagation()}>
                        <div style={{ position: 'sticky', top: 0, backgroundColor: 'var(--surface-2)', padding: '16px', borderBottom: `1px solid var(--border)`, display: 'flex', justifyContent: 'space-between', alignItems: 'center', zIndex: 10 }}>
                            <h2 style={{ margin: 0, fontSize: '18px', fontWeight: 500 }}>{recipe.name}</h2>
                            <button onClick={() => setSelectedRecipe(null)} style={{
                                background: 'none',
                                border: 'none',
                                fontSize: '24px',
                                cursor: 'pointer',
                                color: 'var(--text-secondary)',
                                padding: '0',
                                width: '32px',
                                height: '32px',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center'
                            }}>
                                ✕
                            </button>
                        </div>

                        <div style={{ padding: '24px' }}>
                            <img src={recipe.imageUrl} alt={recipe.name} style={{ width: '100%', height: '300px', objectFit: 'cover', borderRadius: '12px', marginBottom: '24px' }} />

                            <div style={{ marginBottom: '24px' }}>
                                <h3 style={{ fontSize: '16px', fontWeight: 500, marginBottom: '12px', color: 'var(--text-primary)' }}>Ingredients</h3>
                                <ul style={{ margin: 0, paddingLeft: '20px', color: 'var(--text-secondary)' }}>
                                    {recipe.ingredients.map((ing, idx) => (
                                        <li key={idx} style={{ marginBottom: '8px', lineHeight: 1.5 }}>{ing}</li>
                                    ))}
                                </ul>
                            </div>

                            <div style={{ marginBottom: '24px' }}>
                                <h3 style={{ fontSize: '16px', fontWeight: 500, marginBottom: '12px', color: 'var(--text-primary)' }}>Steps to cook</h3>
                                <ol style={{ margin: 0, paddingLeft: '20px', color: 'var(--text-secondary)' }}>
                                    {recipe.steps.map((step, idx) => (
                                        <li key={idx} style={{ marginBottom: '8px', lineHeight: 1.5 }}>{step}</li>
                                    ))}
                                </ol>
                            </div>

                            <div style={{ marginBottom: '24px' }}>
                                <h3 style={{ fontSize: '16px', fontWeight: 500, marginBottom: '12px', color: 'var(--text-primary)' }}>Nutrition facts</h3>
                                <div style={{ overflowX: 'auto' }}>
                                    <table style={{
                                        width: '100%',
                                        borderCollapse: 'collapse',
                                        fontSize: '14px'
                                    }}>
                                        <thead>
                                            <tr style={{ borderBottom: `1px solid var(--border)` }}>
                                                <th style={{ textAlign: 'left', padding: '8px 0', fontWeight: 500, color: 'var(--text-primary)' }}>Nutrient</th>
                                                <th style={{ textAlign: 'right', padding: '8px 0', fontWeight: 500, color: 'var(--text-primary)' }}>Amount</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr style={{ borderBottom: `1px solid var(--border)` }}>
                                                <td style={{ padding: '8px 0', color: 'var(--text-secondary)' }}>Calories</td>
                                                <td style={{ textAlign: 'right', padding: '8px 0', color: 'var(--text-secondary)' }}>{recipe.nutrition.calories.toFixed(0)} kcal</td>
                                            </tr>
                                            <tr style={{ borderBottom: `1px solid var(--border)` }}>
                                                <td style={{ padding: '8px 0', color: 'var(--text-secondary)' }}>Protein</td>
                                                <td style={{ textAlign: 'right', padding: '8px 0', color: 'var(--text-secondary)' }}>{recipe.nutrition.protein.toFixed(1)}g</td>
                                            </tr>
                                            <tr style={{ borderBottom: `1px solid var(--border)` }}>
                                                <td style={{ padding: '8px 0', color: 'var(--text-secondary)' }}>Carbohydrates</td>
                                                <td style={{ textAlign: 'right', padding: '8px 0', color: 'var(--text-secondary)' }}>{recipe.nutrition.carbohydrates.toFixed(1)}g</td>
                                            </tr>
                                            <tr style={{ borderBottom: `1px solid var(--border)` }}>
                                                <td style={{ padding: '8px 0', color: 'var(--text-secondary)' }}>Fat</td>
                                                <td style={{ textAlign: 'right', padding: '8px 0', color: 'var(--text-secondary)' }}>{recipe.nutrition.fat.toFixed(1)}g</td>
                                            </tr>
                                            <tr style={{ borderBottom: `1px solid var(--border)` }}>
                                                <td style={{ padding: '8px 0', color: 'var(--text-secondary)' }}>Saturated fat</td>
                                                <td style={{ textAlign: 'right', padding: '8px 0', color: 'var(--text-secondary)' }}>{recipe.nutrition.saturatedFat.toFixed(1)}g</td>
                                            </tr>
                                            <tr style={{ borderBottom: `1px solid var(--border)` }}>
                                                <td style={{ padding: '8px 0', color: 'var(--text-secondary)' }}>Fiber</td>
                                                <td style={{ textAlign: 'right', padding: '8px 0', color: 'var(--text-secondary)' }}>{recipe.nutrition.fiber.toFixed(1)}g</td>
                                            </tr>
                                            <tr>
                                                <td style={{ padding: '8px 0', color: 'var(--text-secondary)' }}>Sugar</td>
                                                <td style={{ textAlign: 'right', padding: '8px 0', color: 'var(--text-secondary)' }}>{recipe.nutrition.sugar.toFixed(1)}g</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div>
                                <h3 style={{ fontSize: '16px', fontWeight: 500, marginBottom: '12px', color: 'var(--text-primary)' }}>Nutrition breakdown</h3>
                                <ResponsiveContainer width="100%" height={300}>
                                    <RadarChart data={recipe.radarChartData}>
                                        <PolarGrid stroke="var(--border)" />
                                        <PolarAngleAxis dataKey="category" stroke="var(--text-secondary)" style={{ fontSize: '12px' }} />
                                        <PolarRadiusAxis stroke="var(--border)" style={{ fontSize: '12px' }} />
                                        <Radar name="Amount" dataKey="value" stroke="var(--text-accent)" fill="var(--text-accent)" fillOpacity={0.6} />
                                        <Tooltip contentStyle={{
                                            backgroundColor: 'var(--surface-1)',
                                            border: `1px solid var(--border)`,
                                            borderRadius: '8px',
                                            color: 'var(--text-primary)',
                                            fontSize: '12px'
                                        }} formatter={(value, name, props) => [`${props.payload.fullValue.toFixed(0)}`, name]} />
                                    </RadarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div style={{ padding: '24px', maxWidth: '1200px', margin: '0 auto' }}>
                    <h1 style={{ fontSize: '22px', fontWeight: 500, marginBottom: '4px', color: 'var(--text-primary)' }}>My recipes</h1>
                    <p style={{ fontSize: '14px', color: 'var(--text-secondary)', marginBottom: '24px' }}>Browse and filter your favorite recipes</p>

                    <div style={{ marginBottom: '24px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                        <div style={{ position: 'relative' }}>
                            <span style={{
                                position: 'absolute',
                                left: '12px',
                                top: '50%',
                                transform: 'translateY(-50%)',
                                color: 'var(--text-secondary)',
                                fontSize: '18px'
                            }}>🔍</span>
                            <input
                                type="text"
                                placeholder="Search recipes by name or ingredient..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                style={{
                                    width: '100%',
                                    padding: '10px 12px 10px 40px',
                                    border: `1px solid var(--border)`,
                                    borderRadius: 'var(--radius)',
                                    fontSize: '14px',
                                    fontFamily: 'var(--font-sans)',
                                    backgroundColor: 'var(--surface-2)',
                                    color: 'var(--text-primary)',
                                    boxSizing: 'border-box'
                                }}
                            />
                        </div>

                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                            {['all', 'breakfast', 'lunch', 'dinner'].map(type => (
                                <button
                                    key={type}
                                    onClick={() => setSelectedMealType(type)}
                                    style={{
                                        padding: '8px 16px',
                                        border: `1px solid ${selectedMealType === type ? 'var(--border-strong)' : 'var(--border)'}`,
                                        borderRadius: 'var(--radius)',
                                        backgroundColor: selectedMealType === type ? 'var(--bg-accent)' : 'var(--surface-1)',
                                        color: selectedMealType === type ? 'white' : 'var(--text-primary)',
                                        cursor: 'pointer',
                                        fontSize: '13px',
                                        fontWeight: 500,
                                        textTransform: 'capitalize',
                                        transition: 'all 0.2s',
                                        fontFamily: 'var(--font-sans)'
                                    }}
                                >
                                    {type === 'all' ? 'All recipes' : type}
                                </button>
                            ))}
                        </div>
                    </div>

                    {filteredRecipes.length === 0 ? (
                        <div style={{ textAlign: 'center', padding: '48px 24px', color: 'var(--text-secondary)' }}>
                            <p style={{ fontSize: '16px', marginBottom: '8px' }}>No recipes found</p>
                            <p style={{ fontSize: '14px' }}>Try adjusting your search or filters</p>
                        </div>
                    ) : (
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))',
                            gap: '16px',
                            marginBottom: '24px'
                        }}>
                            {filteredRecipes.map(recipe => (
                                <RecipeCard key={recipe.id} recipe={recipe} />
                            ))}
                        </div>
                    )}

                    {selectedRecipe && <RecipeDetail recipe={selectedRecipe} />}

                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)', textAlign: 'center', marginTop: '32px', paddingTop: '24px', borderTop: `1px solid var(--border)` }}>
                        Showing {filteredRecipes.length} of {recipesData.recipes.length} recipes
                    </div>
                </div>
            );
        };

        ReactDOM.render(<RecipeWebsite />, document.getElementById('root'));
    </script>
</body>
</html>
